server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Applicazione a pagina singola: le route di Angular sono gestite dal browser,
    # quindi ogni percorso non corrispondente a un file restituisce index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
